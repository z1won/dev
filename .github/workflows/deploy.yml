name: Deploy Blazor WASM to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PAGES_URL: https://z1won.github.io/dev/

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish dev.csproj -c Release -o release

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare artifact
        run: |
          touch release/wwwroot/.nojekyll
          cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify Pages entrypoint
        run: |
          set -euo pipefail
          echo "Checking ${PAGES_URL}"
          curl --fail --silent --show-error --location \
            --retry 10 --retry-delay 3 --retry-connrefused \
            --max-time 30 "${PAGES_URL}" -o /tmp/dev-index.html
          grep -q '<base href="/dev/"' /tmp/dev-index.html
          grep -q '_framework/blazor.webassembly.js' /tmp/dev-index.html
          echo "Pages entrypoint is reachable and contains the Blazor bootstrap."
